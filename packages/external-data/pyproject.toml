[build-system]
requires = ["uv_build>=0.10.6,<0.11"]
build-backend = "uv_build"

[project]
name = "external-data"
version = "0.1.0"
description = "clients and models for external data sources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cdsapi>=0.7.7",
    "common",
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "patito>=0.8.6",
    "polars>=1.39.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "xarray>=2026.4.0",
]

[tool.uv.sources]
common = { workspace = true }

# This distribution ships a single top-level `external_data` module, housing the
# demoware weather client and the era5_land and nsrdb bronze packages.
[tool.uv.build-backend]
module-name = ["external_data"]
