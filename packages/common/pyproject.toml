[build-system]
requires = ["uv_build>=0.10.6,<0.11"]
build-backend = "uv_build"

[project]
name = "common"
version = "0.1.0"
description = "common building blocks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "annotated-types>=0.7.0",
    "duckdb>=1.0.0",
    "httpx[http2]>=0.28.1",
    "more-itertools>=10.8.0",
    "patito>=0.8.6",
    "polars>=1.39.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "pydantic-core>=2.30.0",
    "tenacity>=9.0.0",
    "whenever>=0.9.4",
]
